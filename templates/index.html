<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام تسجيل الزوار</title>

    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            padding:40px;
        }

        .box{
            background:white;
            width:450px;
            margin:auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            color:#0b5ed7;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:#0b5ed7;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
    </style>

</head>

<body>

<div class="box">

<h2>نظام تسجيل زوار مجمع المنصور سيتي</h2>

<form>

<input type="text" placeholder="اسم الزائر">

<input type="text" placeholder="رقم الهاتف">

<input type="text" placeholder="رقم الشقة">

<input type="text" placeholder="سبب الزيارة">

<button>تسجيل</button>

</form>

</div>

</body>
</html>
