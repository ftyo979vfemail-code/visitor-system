<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>نظام تسجيل الزوار</title>

<style>

body{
    font-family:Arial;
    background:#f3f3f3;
    padding:40px;
}

.box{
    width:500px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#0d6efd;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#0b5ed7;
}

.success{
    color:green;
    text-align:center;
    margin-top:20px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="box">

<h2>نظام تسجيل زوار مجمع المنصور سيتي</h2>

<form method="POST">

<input
type="text"
name="visitor_name"
placeholder="اسم الزائر"
required>

<input
type="text"
name="phone"
placeholder="رقم الهاتف"
required>

<input
type="text"
name="apartment"
placeholder="رقم الشقة"
required>

<input
type="text"
name="reason"
placeholder="سبب الزيارة"
required>

<button type="submit">
تسجيل
</button>

</form>

{% if message %}
<div class="success">
{{ message }}
</div>
{% endif %}

</div>

</body>

</html>
